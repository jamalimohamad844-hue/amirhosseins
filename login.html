<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ورود | ADMIN VIP</title>

  <link rel="stylesheet" href="login.css">
</head>

<body>

  <div class="login-bg">
    <div class="login-glow glow-one"></div>
    <div class="login-glow glow-two"></div>
    <div class="login-grid"></div>
  </div>


  <main class="login-page">

    <section class="login-info">

      <a href="index.html" class="login-logo">
        ADMIN <span>VIP</span>
      </a>

      <div class="login-intro">

        <span>WELCOME BACK</span>

        <h1>
          دوباره
          <strong>خوش آمدی.</strong>
        </h1>

        <p>
          وارد حساب کاربری خودت شو و به فضای
          اختصاصی ADMIN VIP برگرد.
        </p>

      </div>

      <div class="login-numbers">

        <div>
          <b>01</b>
          <small>CREATIVE</small>
        </div>

        <div>
          <b>02</b>
          <small>DESIGN</small>
        </div>

        <div>
          <b>03</b>
          <small>DIGITAL</small>
        </div>

      </div>

    </section>


    <section class="login-box">

      <div class="login-card">

        <div class="login-card-head">

          <div>

            <small>LOGIN ACCOUNT</small>

            <h2>
              خوش برگشتی 👋
            </h2>

            <p>
              اطلاعاتت رو وارد کن.
            </p>

          </div>

          <strong>02</strong>

        </div>


        <form id="loginForm">

          <div class="login-field">

            <label for="email">
              ایمیل یا شماره موبایل
            </label>

            <div class="login-input">

              <span>@</span>

              <input
                type="text"
                id="email"
                placeholder="ایمیل یا شماره موبایل"
                autocomplete="username"
                required
              >

            </div>

          </div>


          <div class="login-field">

            <div class="login-label">

              <label for="password">
                رمز عبور
              </label>

              <a href="#">
                فراموشی رمز؟
              </a>

            </div>


            <div class="login-input">

              <span>◆</span>

              <input
                type="password"
                id="password"
                placeholder="رمز عبور خود را وارد کنید"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                id="showPassword"
                aria-label="نمایش رمز عبور"
              >
                ◉
              </button>

            </div>

          </div>


          <label class="login-check">

            <input
              type="checkbox"
              id="remember"
            >

            <span>
              مرا به خاطر بسپار
            </span>

          </label>


          <button
            type="submit"
            class="login-submit"
          >

            <span>
              ورود به حساب
            </span>

            <b>←</b>

          </button>


          <p
            id="loginMessage"
            class="login-message"
          ></p>

        </form>


        <div class="login-register">

          <span>
            حساب کاربری نداری؟
          </span>

          <a href="register.html">
            ثبت‌نام کن
          </a>

        </div>


        <a
          href="index.html"
          class="login-home"
        >
          ← بازگشت به ADMIN VIP
        </a>

      </div>

    </section>

  </main>


  <script src="auth.js"></script>

</body>

</html>
